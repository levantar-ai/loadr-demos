name: CI

# Ordinary application CI: vet, build and unit-test the Go API.
# The performance tests live in perf.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race
